{id:'arroz',title:'Arroz con verduras',short:'Arroz',portions:4,time:35,ingredients:[{q:300,u:'g',n:'Arroz'},{q:1,u:'pieza',n:'Cebolla',count:1},{q:1,u:'pieza',n:'Pimiento rojo',count:1},{q:1,u:'pieza',n:'Zanahoria',count:1},{q:1,u:'pieza',n:'Calabacita (zucchini)',count:1},{q:2,u:'dientes',n:'Ajo',count:1},{q:600,u:'ml',n:'Caldo de verduras'},{q:2,u:'cucharadas',n:'Aceite',count:1},{n:'Sal y pimienta',taste:1}],steps:['Pica todas las verduras.','Sofríe la cebolla y el ajo en el aceite durante 3 minutos.','Agrega el pimiento, la zanahoria y la calabacita, y cocina 5 minutos más.','Añade el arroz y revuelve durante 1 minuto.','Agrega el caldo caliente, sazona con sal y pimienta y cocina a fuego bajo, con la olla tapada, unos 18 minutos, hasta que el arroz absorba el líquido.','Deja reposar 5 minutos antes de servir.']},

function numeric(n){return new Intl.NumberFormat('es-419',{maximumFractionDigits:2}).format(n);}
function gcd(a,b){return b?gcd(b,a%b):a;}
function fraction(q,p,base){let num=q*p,den=base;const d=gcd(num,den);num/=d;den/=d;if(den===1)return String(num);const whole=Math.floor(num/den),rem=num%den;return (whole?whole+' + ':'')+rem+'/'+den;}
function unit(u,value){const singular={piezas:'pieza',dientes:'diente',discos:'disco',huevos:'huevo',cucharadas:'cucharada',cucharaditas:'cucharadita'};const plural={pieza:'piezas',litro:'litros',limón:'limones',cucharadita:'cucharaditas'};return value<=1?(singular[u]||u):(plural[u]||u);}
function amount(ing,p,base){if(ing.taste)return 'A gusto';const q=ing.q*p/base;return (ing.count?fraction(ing.q,p,base):numeric(q))+' '+unit(ing.u,q);}
function ingredientText(ing,r){return ing.n+': '+amount(ing,r.portions,r.portions)+(ing.alt?' (o 300 g de harina común con 3 cucharaditas de polvo de hornear)':'');}

function renderRecipes(){const r=recipes.find(x=>x.id===state.recipe);const index=recipes.indexOf(r)+1;const done=state.steps[r.id].filter(Boolean).length;page('<div class="reading">'+recipeMenu(r)+'<article class="recipe-content"><div class="eyebrow">Receta 0'+index+' · Paso a paso</div><div class="recipe-title-row"><h2>'+r.title+'</h2><div class="dish-seal">'+plateArt()+'</div></div><div class="meta"><span>'+icon('portion')+r.portions+' porciones</span><span>'+icon('clock')+r.time+' minutos</span></div>'+(r.note?'<p class="note">'+r.note+'</p>':'')+'<div class="actions"><button class="btn quiet" data-scale="'+r.id+'">Ajustar porciones '+icon('portion')+'</button><button class="btn secondary" data-cooked="'+r.id+'" aria-pressed="'+state.cooked.includes(r.id)+'">'+icon('check')+(state.cooked.includes(r.id)?'Preparada · Desmarcar':'Ya la preparé')+'</button></div><p id="recipe-feedback" class="local-feedback" role="status"></p><div class="recipe-columns"><div><h3 class="column-heading">Lo que necesitas</h3><ul class="ingredient-list">'+r.ingredients.map(ing=>'<li>'+ingredientText(ing,r)+'</li>').join('')+'</ul><p class="note">Cantidades originales para '+r.portions+' porciones.</p></div><div><h3 class="column-heading">Así se prepara</h3><p class="small" style="color:var(--muted);margin-bottom:16px">Marca cada paso mientras cocinas.</p><ol class="steps">'+r.steps.map((step,i)=>'<li class="step"><input type="checkbox" id="step-'+i+'" data-step="'+i+'" '+(state.steps[r.id][i]?'checked':'')+'><label for="step-'+i+'"><span class="step-number">'+(i+1)+'</span><span class="step-text">'+step+'</span></label></li>').join('')+'</ol><div class="progress-copy" id="step-copy" role="status">'+done+' de '+r.steps.length+' pasos completados</div><div class="progress-track" role="progressbar" aria-label="Pasos completados" aria-valuemin="0" aria-valuemax="'+r.steps.length+'" aria-valuenow="'+done+'" id="step-progress"><span style="width:'+done/r.steps.length*100+'%"></span></div></di function renderPrepare(){page('<div class="section-head"><div><div class="eyebrow">Antes de empezar</div><h2>Cocina con calma.</h2><p>Lee, prepara y mide. Unos minutos de organización te ayudan a disfrutar el momento.</p></div></div><div class="split"><section><h3>Antes de encender el fuego</h3><ul class="preparation">'+prepItems.map((text,i)=>'<li><label><input type="checkbox" data-prep="'+i+'" '+(state.prep[i]?'checked':'')+'><span>'+text+'</span></label></li>').join('')+'</ul><p class="local-feedback" id="prep-feedback" role="status">'+state.prep.filter(Boolean).length+' de 4 puntos completados</p><div class="actions"><button class="btn" data-route="recipes">Elegir una receta '+icon('arrow')+'</button></div><figure class="quote"><blockquote>“Cocinar con todo a mano evita apuros y errores.”</blockquote><figcaption>Antes de cocinar · Del recetario</figcaption></figure></section><section><h3>Pequeñas claves de cocina</h3><p class="note">Toca cada tarjeta para leer su explicación.</p><div class="concept-grid">'+concepts.map(([title,text])=>'<details class="concept"><summary>'+title+'</summary><p>'+text+'</p></details>').join('')+'</div><div class="about"><h3>Sobre mí</h3><p>Soy Rosa, mamá, abuela y cocinera de domingo de toda la vida. En mi casa, la mesa siempre fue el lugar donde nos juntamos a charlar, reírnos y ponernos al día.</p><p>Durante años mi familia me pidió que les pasara mis recetas, así que decidí reunir las favoritas en este recetario. Son platos simples, rendidores y probados mil veces, para que tú también disfrutes cocinar y compartir.</p></div></section></div>');}
function renderCalculator(){const r=recipes.find(x=>x.id===state.calcRecipe);page('<div class="section-head"><div><div class="eyebrow">Calculadora de porciones</div><h2>Hay lugar para todos.</h2><p>Elige una receta y cuántas porciones necesitas. Ajustaremos cada ingrediente a tu mesa.</p></div></div><div class="split"><div><form id="calculator-form" class="calculator-form" novalidate><div class="field"><label for="calc-recipe">¿Qué quieres cocinar?</label><select id="calc-recipe">'+recipes.map(x=>'<option value="'+x.id+'" '+(x.id===r.id?'selected':'')+'>'+x.title+'</option>').join('')+'</select><p class="note" id="original-portions">La receta original rinde '+r.portions+' porciones.</p></div><div class="field"><label for="portions">Porciones que necesitas</label><div class="quantity-controls"><button type="button" data-adjust="-1" aria-label="Quitar una porción">−</button><input id="portions" type="number" min="1" max="40" step="1" inputmode="numeric" value="'+state.portions+'" aria-describedby="portion-help calc-error"><button type="button" data-adjust="1" aria-label="Añadir una porción">+</button></div><p class="note" id="portion-help">Elige un número entero entre 1 y 40.</p></div><button class="btn" type="submit">Calcular ingredientes '+icon('portion')+'</button><p id="calc-error" class="error" role="alert"></p></form><p class="note">Las cantidades se ajustan de forma proporcional. Los tiempos y las temperaturas de la receta no se multiplican; revisa la cocción al cambiar el tamaño del molde o la cantidad.</p></div><section class="result-sheet" id="calc-result" aria-live="polite"><div class="eyebrow">Tu lista de ingredientes</div><h3 class="result-heading">Una receta a tu medida</h3><p class="result-detail">Pulsa “Calcular ingredientes” para ver las cantidades. Puedes volver a calcular cuando lo necesites.</p><figure class="quote"><blockquote>“Hay comidas que saben a casa.”</blockquote><figcaption>Del recetario</figcaption></figure></section></div>');}
function calculate(){const input=document.getElementById('portions');const p=Number(input.value);const error=document.getElementById('calc-error');if(input.value.trim()===''||!Number.isFinite(p)||!Number.isInteger(p)||p<1||p>40){error.textContent='Escribe un número entero de porciones entre 1 y 40.';input.setAttribute('aria-invalid','true');document.getElementById('calc-result').innerHTML='<h3 class="result-heading">Revisa las porciones</h3><p class="result-detail">Las cantidades se mostrarán cuando ingreses un valor válido.</p>';return;}input.removeAttribute('aria-invalid');error.textContent='';const r=recipes.find(x=>x.id===document.getElementById('calc-recipe').value);if(!r)return;state.calcRecipe=r.id;state.portions=p;state.calculated=true;const saved=persist();document.getElementById('calc-result').innerHTML='<div class="eyebrow">Cantidades ajustadas</div><h3 class="result-heading">'+r.title+'</h3><p class="result-detail">Para '+p+' '+(p===1?'porción':'porciones')+' · Receta original: '+r.portions+' porciones<br>Factor: '+fraction(1,p,r.portions)+' ×</p>'+r.ingredients.map(ing=>'<div class="scaled-row"><span>'+ing.n+'</span><strong>'+amount(ing,p,r.portions)+'</strong></div>'+(ing.alt?'<p class="note" style="margin:8px 0 14px">Alternativa: '+numeric(300*p/r.portions)+' g de harina común con '+fraction(3,p,r.portions)+' '+unit('cucharaditas',3*p/r.portions)+' de polvo de hornear.</p>':'')).join('')+'<p class="note">Las fracciones indican partes de una pieza o medida. Por ejemplo, 1/2 significa la mitad. Para una fracción de huevo, bátelo y mide la parte necesaria. Las cantidades de peso y volumen se muestran con hasta dos decimales.</p><p class="local-feedback">'+(saved?'Porciones guardadas. Insignia “Una mesa a tu medida” desbloqueada.':'Cálculo listo. El guardado no está disponible.')+'</p><button class="btn secondary" data-recipe="'+r.id+'">Ver el paso a paso '+icon('arrow')+'</button>';}
function wheelMarkup(){const colors=['#93334E','#A66477','#764555','#AE7788','#80465A'];let paths='';for(let i=0;i<5;i++){const a=(-90+i*72)*Math.PI/180,b=(-90+(i+1)*72)*Math.PI/180,mid=(-90+(i+.5)*72)*Math.PI/180;const x1=200+190*Math.cos(a),y1=200+190*Math.sin(a),x2=200+190*Math.cos(b),y2=200+190*Math.sin(b);paths+='<path d="M200 200 L'+x1+' '+y1+' A190 190 0 0 1 '+x2+' '+y2+' Z" fill="'+colors[i]+'" stroke="#FFFFFF" stroke-width="2"/><g transform="translate('+(200+125*Math.cos(mid))+' '+(200+125*Math.sin(mid))+') rotate('+(i*72+36)+')"><text text-anchor="middle" fill="#FFF" font-family="Georgia,serif" font-size="23">'+recipes[i].short+'</text><text text-anchor="middle" y="23" fill="#FFF" font-family="system-ui,sans-serif" font-size="12">0'+(i+1)+'</text></g>';}return '<svg class="wheel-svg" id="wheel" viewBox="0 0 400 400" role="img" aria-label="Ruleta con cinco segmentos: arroz, tarta, guiso, pollo y budín">'+paths+'</svg>';}

function renderRoulette(){rotation=0;page('<div class="section-head"><div><div class="eyebrow">Una pequeña sorpresa</div><h2>¿Qué cocinamos hoy?</h2><p>Gira la rueda y deja que una de las cinco recetas te inspire. Todas tienen la misma oportunidad de salir.</p></div></div><div class="roulette-layout"><div class="wheel-area"><div class="wheel-wrap"><div class="pointer" aria-hidden="true"></div>'+wheelMarkup()+'<div class="wheel-center" aria-hidden="true">R</div></div><button class="btn" id="spin-button">Girar la ruleta '+icon('wheel')+'</button><p class="local-feedback" id="spin-status" role="status">Puedes girarla tantas veces como quieras.</p></div><section class="wheel-result" id="wheel-result" aria-live="polite">'+(state.lastSpin?wheelResult(recipes.find(x=>x.id===state.lastSpin)):'<div class="eyebrow">Tu próximo plato</div><h3>Un domingo por descubrir.</h3><p>El resultado aparecerá aquí cuando la rueda se detenga.</p><figure class="quote"><blockquote>“¡Que lo disfrutes en familia!”</blockquote><figcaption>Del recetario</figcaption></figure>')+'</section></div>');}
function randomRecipeIndex(){if(globalThis.crypto&&typeof crypto.getRandomValues==='function'){const values=new Uint32Array(1);const limit=4294967295;do{crypto.getRandomValues(values);}while(values[0]>=limit);return values[0]%5;}return Math.floor(Math.random()*5);}
function spin(){if(spinning)return;spinning=true;const chosen=randomRecipeIndex();const wheel=document.getElementById('wheel'),button=document.getElementById('spin-button');button.disabled=true;button.textContent='Girando…';document.getElementById('spin-status').textContent='La rueda está girando. Enseguida verás tu receta.';document.getElementById('wheel-result').innerHTML='<div class="eyebrow">Preparando tu sorpresa</div><h3>Un momento…</h3><p>El puntero señalará la receta elegida.</p>';document.querySelectorAll('#navigation button').forEach(b=>b.disabled=true);const target=(360-(chosen+.5)*72)%360;rotation+=5*360+((target-rotation%360+360)%360);wheel.style.transform='rotate('+rotation+'deg)';const reduced=typeof matchMedia==='function'&&matchMedia('(prefers-reduced-motion: reduce)').matches;let finished=false;function finish(){if(finished)return;finished=true;wheel.removeEventListener('transitionend',onTransition);clearTimeout(timer);state.spun=true;state.lastSpin=recipes[chosen].id;persist();document.getElementById('wheel-result').innerHTML=wheelResult(recipes[chosen]);document.getElementById('spin-status').textContent='Resultado: '+recipes[chosen].title+'. Puedes volver a girar.';button.disabled=false;button.innerHTML='Volver a girar '+icon('wheel');spinning=false;document.querySelectorAll('#navigation button').forEach(b=>b.disabled=false);}function onTransition(event){if(event.propertyName==='transform')finish();}wheel.addEventListener('transitionend',onTransition);const timer=setTimeout(finish,reduced?80:3800);}
function renderBadges(){return badgeDefs.map(b=>{const unlocked=Boolean(b.test(state));return '<div class="badge '+(unlocked?'unlocked':'')+'"><div class="badge-icon">'+icon(unlocked?'medal':'leaf')+'</div><div><h3>'+b.title+'</h3><p>'+b.desc+'</p><span class="badge-state">'+(unlocked?'Desbloqueada':'Por descubrir')+'</span></div></div>';}).join('');}
function badgeCount(){return badgeDefs.filter(b=>b.test(state)).length;}
function renderJournal(){page('<div class="section-head"><div><div class="eyebrow">Mi cocina</div><h2>Recuerdos que se quedan.</h2><p>Un pequeño cuaderno para tu mesa y las insignias de tu recorrido.</p></div></div><div class="split"><section><div class="journal-intro"><p>Tus respuestas son personales. Se guardan en este navegador, junto con tu progreso. Cada dispositivo conserva su propio cuaderno.</p></div><h3>Una pausa para pensar</h3>'+prompts.map((prompt,i)=>'<div class="reflection"><label for="note-'+i+'">'+prompt+'</label><textarea id="note-'+i+'" data-note="'+i+'" maxlength="3000" placeholder="Escribe lo que quieras recordar…">'+esc(state.notes[i])+'</textarea><div class="save-status" id="note-status-'+i+'" role="status">'+(state.notes[i]?'Respuesta recuperada.':'Tu respuesta se guardará mientras escribes.')+'</div></div>').join('')+'<div class="actions"><button class="btn" id="save-notes">Guardar respuestas '+icon('save')+'</button></div><p class="local-feedback" id="notes-feedback" role="status"></p></section><section><h3>Pequeños logros de domingo</h3><p class="badge-count" id="badge-count">'+badgeCount()+' de '+badgeDefs.length+' insignias desbloqueadas · '+state.cooked.length+' de 5 recetas preparadas</p><div class="badge-list" id="badge-list">'+renderBadges()+'</div><figure class="quote"><blockquote>“Son platos simples, rendidores y probados mil veces, para que tú también disfrutes cocinar y compartir.”</blockquote><figcaption>Del recetario</figcaption></figure></section></div>');}
function refreshBadges(){const list=document.getElementById('badge-list');if(list){list.innerHTML=renderBadges();document.getElementById('badge-count').textContent=badgeCount()+' de '+badgeDefs.length+' insignias desbloqueadas · '+state.cooked.length+' de 5 recetas preparadas';}}
document.getElementById('navigation').addEventListener('click',e=>{const b=e.target.closest('[data-route]');if(b)navigate(b.dataset.route);});
view.addEventListener('click',e=>{const b=e.target.closest('button');if(!b||b.disabled)return;if(b.dataset.route)navigate(b.dataset.route);else if(b.dataset.recipe){state.recipe=b.dataset.recipe;navigate('recipes');}else if(b.dataset.scale){state.calcRecipe=b.dataset.scale;state.portions=recipes.find(r=>r.id===b.dataset.scale).portions;persist();navigate('calculator');}else if(b.dataset.cooked){const id=b.dataset.cooked;const done=state.cooked.includes(id);state.cooked=done?state.cooked.filter(x=>x!==id):[...state.cooked,id];const saved=persist();b.setAttribute('aria-pressed',String(!done));b.innerHTML=icon('check')+(!done?'Preparada · Desmarcar':'Ya la preparé');document.getElementById('recipe-feedback').textContent=(done?'Receta desmarcada.':'Receta marcada como preparada. Insignias actualizadas.')+(saved?'':' El guardado no está disponible.');}else if(b.dataset.adjust){const input=document.getElementById('portions');const n=Number(input.value);input.value=String(Math.max(1,Math.min(40,(Number.isInteger(n)?n:state.portions)+Number(b.dataset.adjust))));document.getElementById('calc-error').textContent='Pulsa “Calcular ingredientes” para actualizar tu lista.';document.getElementById('calc-result').innerHTML='<h3 class="result-heading">Porciones por actualizar</h3><p class="result-detail">Has elegido '+input.value+' porciones. Calcula para ver las nuevas cantidades.</p>';input.removeAttribute('aria-invalid');}else if(b.id==='spin-button')spin();else if(b.id==='save-notes'){const saved=persist();document.getElementById('notes-feedback').textContent=saved?'Tus respuestas están guardadas.':'Tus respuestas siguen disponibles durante esta sesión. El guardado no está disponible.';refreshBadges();}});
view.addEventListener('change',e=>{const el=e.target;if(el.dataset.step!==undefined){const r=recipes.find(r=>r.id===state.recipe);state.steps[r.id][Number(el.dataset.step)]=el.checked;persist();const done=state.steps[r.id].filter(Boolean).length;document.getElementById('step-copy').textContent=done+' de '+r.steps.length+' pasos completados';document.getElementById('step-progress').setAttribute('aria-valuenow',String(done));document.querySelector('#step-progress span').style.width=done/r.steps.length*100+'%';}else if(el.dataset.prep!==undefined){state.prep[Number(el.dataset.prep)]=el.checked;persist();const done=state.prep.filter(Boolean).length;document.getElementById('prep-feedback').textContent=done+' de 4 puntos completados'+(done===4?' · Insignia “Todo a mano” desbloqueada.':'');}else if(el.id==='calc-recipe'){state.calcRecipe=el.value;const r=recipes.find(r=>r.id===el.value);document.getElementById('original-portions').textContent='La receta original rinde '+r.portions+' porciones.';document.getElementById('calc-result').innerHTML='<h3 class="result-heading">'+r.title+'</h3><p class="result-detail">Pulsa “Calcular ingredientes” para ajustar esta receta.</p>';persist();}});
view.addEventListener('input',e=>{const el=e.target;if(el.dataset.note!==undefined){const i=Number(el.dataset.note);state.notes[i]=el.value.slice(0,3000);const saved=persist();document.getElementById('note-status-'+i).textContent=saved?'Guardado.':'Disponible durante esta sesión; no se pudo guardar.';refreshBadges();}else if(el.id==='portions'){document.getElementById('calc-result').innerHTML='<h3 class="result-heading">Porciones por actualizar</h3><p class="result-detail">Pulsa “Calcular ingredientes” para actualizar la lista.</p>';}});
view.addEventListener('submit',e=>{if(e.target.id==='calculator-form'){e.preventDefault();calculate();}});
document.getElementById('storage-alert').hidden=storageOK;
updateNav();renderHome();
</script>
</body>
</html>
